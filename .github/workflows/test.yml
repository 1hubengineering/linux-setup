name: Validate setup
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh fzf
      - run: for script in install.sh uninstall.sh config/bash/* config/shell/*; do bash -n "$script" || exit; done
      - run: for script in config/zsh/*; do zsh -n "$script" || exit; done
      - run: python3 -m unittest discover -s tests -v
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/smoke-install.py
